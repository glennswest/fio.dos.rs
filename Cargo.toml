[package]
name = "fio-dos"
version = "0.1.0"
edition = "2021"
authors = ["Glenn West"]
description = "Async userspace file I/O into a FAT12/FAT16/FAT32 filesystem — read and write files with no kernel, no mount and no loop device"
repository = "https://github.com/glennswest/fio.dos.rs"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
keywords = ["fat32", "filesystem", "async", "userspace", "efi"]
categories = ["filesystem", "asynchronous"]

[lib]
name = "fio_dos"
path = "src/lib.rs"

[dependencies]
# The on-disk format, the device seam and the read layer all come from here.
#
# By path until mkfs.dos.rs is published. It must become the git form below
# before anything takes this crate by git — a path dependency inside a git
# dependency only resolves when the path is inside the same repository, so a
# consumer of this crate would fail to build:
#
#   mkfs-dos = { git = "https://github.com/glennswest/mkfs.dos.rs", tag = "v0.1.0", default-features = false }
#
# with the [patch] section at the bottom kept for local development.
mkfs-dos = { path = "../mkfs.dos.rs", default-features = false }

tokio = { version = "1", features = ["fs", "io-std", "io-util", "rt", "sync", "macros"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow", "tokio/rt-multi-thread"]

[[bin]]
name = "fio-dos"
path = "src/bin/fio_dos.rs"
required-features = ["cli"]

[profile.release]
lto = true
